<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro - Login</title>
    <link rel="stylesheet" href="style.css">                                                                  
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="images/logo.png" alt="College Logo">
                <h2>EventPro</h2>
            </div>
            <h3>Welcome Back!</h3>
            <p>Login to explore campus events</p>
            
            <form>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="College Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">
                    <a href="index.html">Login</a>
                </button>
                
            </form>
            
            <p class="signup-link">New user? <a href="#">Create Account</a></p>
        </div>
    </div>
</body>
</html>
